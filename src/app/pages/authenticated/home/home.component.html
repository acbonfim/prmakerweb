<div class="home-container">

  <!-- Hero / Saudação -->
  <div class="hero-section">
    <div class="hero-text">
      <h1 class="greeting">{{ greeting }}, <span class="user-name">{{ firstName }}</span> 👋</h1>
      <p class="current-date">{{ currentDate }}</p>
      <p class="subtitle">O que você precisa fazer hoje?</p>
    </div>
    <div class="hero-decoration" aria-hidden="true">
      <mat-icon class="hero-icon">dashboard</mat-icon>
    </div>
  </div>

  <!-- Seus últimos cards + Cards que você participou (duas colunas; uma vazia → a outra ocupa 100%) — 0051 -->
  <div class="recent-columns"
       [class.single]="!(mineVisible() && participatedVisible())">
    <app-home-cards scope="mine" title="Seus últimos cards" icon="history"
                    [class.col-hidden]="!mineVisible()"
                    (visibilityChange)="mineVisible.set($event)"></app-home-cards>
    <app-home-cards scope="participated" title="Cards que você participou" icon="groups"
                    [class.col-hidden]="!participatedVisible()"
                    (visibilityChange)="participatedVisible.set($event)"></app-home-cards>
  </div>

  @if (!mineVisible() && !participatedVisible()) {
    <div class="home-empty">
      <mat-icon>inbox</mat-icon>
      <span>Nenhum card por aqui ainda. Busque um card na tela de Pull Requests para começar.</span>
    </div>
  }

</div>

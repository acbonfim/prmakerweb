<div class="page-header" [class.page-header--alert]="hasCardNonConformity">
  <mat-icon class="header-icon">merge</mat-icon>
  <span class="header-title">Gerenciamento de tratamento do card</span>
  @if (cardFull) {
    <app-card-alert-bar class="ms-auto"
      [inline]="true"
      [alerts]="cardFull.alerts"></app-card-alert-bar>
  }
</div>

    <div class="pr-top-row">
    <div class="pr-toolbar">
      <!-- Número do card -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic"
                      class="pr-field pr-field--card">
        <mat-label>Número do card</mat-label>
        <input matInput type="number"
               [(ngModel)]="cardNumber"
               (ngModelChange)="onCardNumberChange()"
               (keyup.enter)="getPullRequestByCardNumber()"
               placeholder="Ex. 12345"/>
        <button matSuffix mat-icon-button aria-label="Buscar card"
                matTooltip="Buscar" matTooltipPosition="above"
                (click)="getPullRequestByCardNumber()"
                [disabled]="!cardNumber || !environmentName || isPullRequestLoading">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
    </div>

      <!-- Quem abriu / datas + popovers de Descrição e Root Cause (spec 2, 2.3) -->
      @if (prInfo) {
        <app-pr-info-card class="pr-toolbar__info"
                          [userName]="prInfo.userName"
                          [userPhoto]="prInfo.userPhoto"
                          [openedAt]="prInfo.openedAt"
                          [updatedAt]="prInfo.updatedAt"
                          [authorLabel]="prInfo.openedAt ? 'Aberto por' : 'Card ainda não salvo'">
          <ng-container ngProjectAs="[info-actions]">
            <app-panel-popover-button kind="description"></app-panel-popover-button>
            @if (cardType !== 'us') {
              <app-panel-popover-button kind="rootCause"></app-panel-popover-button>
            }
          </ng-container>
        </app-pr-info-card>
      }
    </div>

    <!--
        @if (template !== null){
          <button matButton
                  (click)="openDialogTemplate()"
                  matTooltip="Clique para ver o template carregado"
                  matTooltipPosition="above"
                  style="margin-bottom: 10px"><mat-icon>article_shortcut</mat-icon>Template carregado</button>
        }-->

        <div class="pr-content-row">
          <div class="pr-fields">
            <!-- PRs abertos no GitHub para o card, com status atual (spec 1.4/3); clique abre o modal (3.1) -->
            <app-card-panel class="pr-panel" title="Pull Requests" icon="merge">
              @if (prInfo) {
                <button panel-actions mat-icon-button class="panel-action"
                        (click)="refreshGithubPrs()"
                        [disabled]="prState.githubPrsLoading()"
                        matTooltip="Atualizar status no GitHub" matTooltipPosition="above">
                  <mat-icon>refresh</mat-icon>
                </button>
              }
              <app-github-pr-list [prs]="prState.githubPrs()"
                                  [loading]="prState.githubPrsLoading() || isPullRequestLoading"
                                  [emptyMessage]="prInfo ? 'Nenhum PR aberto para este card. Use Abrir PR.' : 'Busque um card para ver os PRs abertos.'"
                                  (select)="openPrDialog($event)"></app-github-pr-list>
            </app-card-panel>
          </div>

          <div class="pr-timeline">
            <app-card-timeline [cardNumber]="cardNumber"></app-card-timeline>
          </div>
        </div>

      <div class="page-footer">
        @if(!isMobile){
          <p-splitbutton class="custom-buttom"
                         label="Copiar"
                         icon="pi pi-copy"
                         [disabled]="isPullRequestLoading || fullDescription === null"
                         [model]="copyCustomButtons" (onClick)="copyFullDescriptionToClipboard('full')" rounded severity="secondary"/>
          <button mat-raised-button style="margin-left: 10px"
                  (click)="openPrDialog()"
                  [disabled]="!canOpenPr">Abrir PR<mat-icon>merge</mat-icon></button>

          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="isPullRequestLoading || !prInfo"
                  (click)="savePullRequest()">Salvar<mat-icon>save</mat-icon></button>
          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="isPullRequestLoading || !hasAnythingToClear"
                  (click)="clearAll()">Limpar<mat-icon>clear</mat-icon></button>

          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="!cardFull || isCardDetailsLoading"
                  (click)="openCardDetails()">
            Detalhes do Card<mat-icon>fact_check</mat-icon>
          </button>

          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="!cardFull || isCardDetailsLoading"
                  (click)="openHandover()">
            Handover<mat-icon>swap_horiz</mat-icon>
          </button>

          <!-- Button to generate prompt for AI processing
          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="!cardNumber"
                  (click)="openDialogPrompt()">Gerar Prompt
            <mat-icon>model_training</mat-icon>
          </button>
          Button to save root cause to DevOps (currently disabled) -->

      <button mat-raised-button
              (click)="saveRootCauseToDevOps()"
              [disabled]="isAzureLoading || !cardNumber || !pullRequest?.rootCause || cardType === 'us'"
              style="margin-left: 10px">
        Salvar RC no DevOps
        <mat-icon>beenhere</mat-icon>
      </button>
      <button mat-raised-button style="margin-left: 10px"
              [disabled]="!cardNumber"
              (click)="generatePullRequestWithAi()"
      >Gerar com IA<mat-icon>model_training</mat-icon></button>


    } @else {
      <p-splitbutton style="width: 100% !important"
        label="Salvar"
                     icon="pi pi-save"
                     [disabled]="isPullRequestLoading || !prInfo"
                     [model]="mobileButtons" (onClick)="savePullRequest()" rounded severity="secondary" />
    }




      </div>
<ngx-loading-bar></ngx-loading-bar>

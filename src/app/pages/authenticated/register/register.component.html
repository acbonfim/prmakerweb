<div class="pr-root">
  <mat-card appearance="outlined">
    <mat-card-header class="p-3"
                     style="background-color: #252525; border-radius: 10px">
      <mat-card-title class="" style="display: flex; align-items: center; gap: 8px; width: 100%;">
        <mat-icon>merge</mat-icon>
        Gerenciamento de tratamento do card
        @if (cardFull) {
          <app-card-alert-bar
            style="margin-left: auto;"
            [inline]="true"
            [alerts]="cardFull.alerts"></app-card-alert-bar>
        }
      </mat-card-title>
    </mat-card-header>
  <mat-card-content>
    <div class="mt-2 mb-2 row" style="display: flex; align-items: flex-start; gap: 15px; margin-top: 10px;">
      <div style="display: flex; gap: 10px; width: 100%">
        <p-inputgroup styleClass="custom-input-group">
          <p-inputnumber
            [(ngModel)]="cardNumber"
            (ngModelChange)="onCardNumberChange()"
            placeholder="Número do card"
            inputId="minmaxfraction"
            mode="decimal" [useGrouping]="false">
          </p-inputnumber>
          <p-inputgroup-addon>
            <p-button
              (onClick)="getPullRequestByCardNumber()"
              [disabled]="!cardNumber || !environmentName || isPullRequestLoading"
              icon="pi pi-search" severity="secondary" variant="text"/>
          </p-inputgroup-addon>
        </p-inputgroup>

        <p-inputgroup style="width: auto">
          <p-inputgroup-addon
            (dblclick)="onPrefixDoubleClick()"
            [style.cursor]="'pointer'"
            [style.user-select]="'none'"
          >
            @if (!isEditingPrefix) {
              {{ branchPrefix }}
            } @else {
              <input
                pInputText
                [(ngModel)]="branchPrefix"
                (blur)="onPrefixBlur()"
                (ngModelChange)="onPrefixChange()"
                style="width: 80px; padding: 0.25rem; height: 100%;"
                autofocus
              />
            }
          </p-inputgroup-addon>
          <input pInputText placeholder="branch name" [(ngModel)]="branchName"/>
        </p-inputgroup>

        <p-inputgroup style="width: auto; min-width: 190px;">
          <p-autoComplete
            [(ngModel)]="selectedRepositoryObj"
            [suggestions]="filteredRepositories"
            (completeMethod)="filterRepositories($event)"
            (onSelect)="onRepositorySelect()"
            (onClear)="onRepositorySelect()"
            field="label"
            placeholder="Repositório"
            [dropdown]="true"
            [forceSelection]="true"
            styleClass="repo-autocomplete"
          ></p-autoComplete>
        </p-inputgroup>

        <p-selectbutton
          class="mr-auto"
          [options]="justifyOptions"
          [(ngModel)]="environmentName"
          optionLabel="label"
          optionValue="value"
          styleClass="custom-select-button">
        </p-selectbutton>



<!--        <p-selectbutton-->
<!--          class="mr-auto"-->
<!--          [options]="cardTypeOptions"-->
<!--          [(ngModel)]="cardType"-->
<!--          optionLabel="label"-->
<!--          optionValue="value"-->
<!--          styleClass="custom-select-button">-->
<!--        </p-selectbutton>-->
      </div>


    </div>

    <!--
        @if (template !== null){
          <button matButton
                  (click)="openDialogTemplate()"
                  matTooltip="Clique para ver o template carregado"
                  matTooltipPosition="above"
                  style="margin-bottom: 10px"><mat-icon>article_shortcut</mat-icon>Template carregado</button>
        }-->

        <div class="pr-content-row">
          <div class="pr-fields">
            <app-card-panel class="pr-panel" title="Descrição" icon="description">
              @if (fullDescription !== null) {
                <button panel-actions mat-icon-button class="panel-action"
                        (click)="openDialogFullDescription()"
                        matTooltip="Descrição montada"
                        matTooltipPosition="above">
                  <mat-icon>article_shortcut</mat-icon>
                </button>
              }
              <p-editor class="panel-editor"
                        [(ngModel)]="descriptionHtml"
                        (onTextChange)="onDescriptionEditorChange($event)"
                        placeholder="Ex. It makes me feel...">
                <ng-template pTemplate="header">
                  <span class="ql-formats">
                    <select class="ql-header">
                      <option value="1"></option>
                      <option value="2"></option>
                      <option value="3"></option>
                      <option selected></option>
                    </select>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-bold" aria-label="Negrito" type="button"></button>
                    <button class="ql-italic" aria-label="Itálico" type="button"></button>
                    <button class="ql-strike" aria-label="Tachado" type="button"></button>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-list" value="ordered" aria-label="Lista ordenada" type="button"></button>
                    <button class="ql-list" value="bullet" aria-label="Lista" type="button"></button>
                    <button class="ql-blockquote" aria-label="Citação" type="button"></button>
                    <button class="ql-code-block" aria-label="Código" type="button"></button>
                  </span>
                  <span class="ql-formats">
                    <button class="ql-link" aria-label="Link" type="button"></button>
                    <button class="ql-clean" aria-label="Limpar formatação" type="button"></button>
                  </span>
                </ng-template>
              </p-editor>
            </app-card-panel>

            @if(this.cardType !== 'us'){
              <app-card-panel class="pr-panel" title="Root Cause" icon="troubleshoot">
                @if (pullRequest.rootCause && pullRequest.rootCause.length) {
                  <button panel-actions mat-icon-button class="panel-action"
                          (click)="openDialogRCA()"
                          matTooltip="Root Cause"
                          matTooltipPosition="above">
                    <mat-icon>article_shortcut</mat-icon>
                  </button>
                }
                <p-editor class="panel-editor"
                          [(ngModel)]="rootCauseHtml"
                          (onTextChange)="onRootCauseEditorChange($event)"
                          placeholder="Ex. It makes me feel...">
                  <ng-template pTemplate="header">
                    <span class="ql-formats">
                      <select class="ql-header">
                        <option value="1"></option>
                        <option value="2"></option>
                        <option value="3"></option>
                        <option selected></option>
                      </select>
                    </span>
                    <span class="ql-formats">
                      <button class="ql-bold" aria-label="Negrito" type="button"></button>
                      <button class="ql-italic" aria-label="Itálico" type="button"></button>
                      <button class="ql-strike" aria-label="Tachado" type="button"></button>
                    </span>
                    <span class="ql-formats">
                      <button class="ql-list" value="ordered" aria-label="Lista ordenada" type="button"></button>
                      <button class="ql-list" value="bullet" aria-label="Lista" type="button"></button>
                      <button class="ql-blockquote" aria-label="Citação" type="button"></button>
                      <button class="ql-code-block" aria-label="Código" type="button"></button>
                    </span>
                    <span class="ql-formats">
                      <button class="ql-link" aria-label="Link" type="button"></button>
                      <button class="ql-clean" aria-label="Limpar formatação" type="button"></button>
                    </span>
                  </ng-template>
                </p-editor>
              </app-card-panel>
            }
          </div>

          <div class="pr-timeline">
            <app-card-timeline [cardNumber]="cardNumber"></app-card-timeline>
          </div>
        </div>

      </mat-card-content>
      <mat-card-actions style="background-color: #252525; margin-top: 20px; border-radius: 10px;">
        @if(!isMobile){
          <p-splitbutton class="custom-buttom"
                         label="Copiar"
                         icon="pi pi-copy"
                         [disabled]="isPullRequestLoading || fullDescription === null"
                         [model]="copyCustomButtons" (onClick)="copyFullDescriptionToClipboard('full')" rounded severity="secondary"/>
          <button mat-raised-button style="margin-left: 10px"
                  (click)="openGithubPullRequestPage()"
                  [disabled]="!this.pullRequest?.description || !this.environmentName.length">Abrir PR<mat-icon>merge</mat-icon></button>

          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="isPullRequestLoading || fullDescription === null"
                  (click)="savePullRequest()">Salvar<mat-icon>save</mat-icon></button>
          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="isPullRequestLoading || fullDescription === null"
                  (click)="clearAll()">Limpar<mat-icon>clear</mat-icon></button>

          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="!cardFull || isCardDetailsLoading"
                  (click)="openCardDetails()">
            Detalhes do Card<mat-icon>fact_check</mat-icon>
          </button>

          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="!cardFull"
                  (click)="openHandover()">
            Handover<mat-icon>swap_horiz</mat-icon>
          </button>

          <!-- Button to generate prompt for AI processing
          <button mat-raised-button style="margin-left: 10px"
                  [disabled]="!cardNumber"
                  (click)="openDialogPrompt()">Gerar Prompt
            <mat-icon>model_training</mat-icon>
          </button>
          Button to save root cause to DevOps (currently disabled) -->

      <button mat-raised-button
              (click)="saveRootCauseToDevOps()"
              [disabled]="isAzureLoading || !cardNumber || !pullRequest?.rootCause || cardType === 'us'"
              style="margin-left: 10px">
        Salvar RC no DevOps
        <mat-icon>beenhere</mat-icon>
      </button>
      <button mat-raised-button style="margin-left: 10px"
              [disabled]="!cardNumber"
              (click)="generatePullRequestWithAi()"
      >Gerar com IA<mat-icon>model_training</mat-icon></button>


    } @else {
      <p-splitbutton style="width: 100% !important"
        label="Salvar"
                     icon="pi pi-save"
                     [disabled]="isPullRequestLoading || fullDescription === null"
                     [model]="mobileButtons" (onClick)="savePullRequest()" rounded severity="secondary" />
    }




  </mat-card-actions>
</mat-card>
</div>
<ngx-loading-bar></ngx-loading-bar>

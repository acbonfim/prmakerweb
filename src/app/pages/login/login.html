<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <img src="assets/images/logo.svg" alt="Solvace PRForm" class="login-logo">
    </div>

    <h1>Entrar</h1>
    <p class="login-sub">Acesse sua conta para continuar.</p>

    <mat-form-field appearance="outline" class="login-field">
      <mat-label>Usuário</mat-label>
      <input matInput [(ngModel)]="creds!.username" (keydown.enter)="login()" autocomplete="username">
    </mat-form-field>

    <mat-form-field appearance="outline" class="login-field">
      <mat-label>Senha</mat-label>
      <input matInput [type]="hide ? 'password' : 'text'" [(ngModel)]="creds!.password"
             (keydown.enter)="login()" autocomplete="current-password">
      <button mat-icon-button matSuffix type="button" (click)="hide = !hide"
              [attr.aria-label]="hide ? 'Mostrar senha' : 'Ocultar senha'">
        <mat-icon>{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
    </mat-form-field>

    <div class="login-options">
      <mat-slide-toggle color="primary" (ngModelChange)="clearAccess()"
                        [(ngModel)]="salvarLogin" [checked]="salvarLogin">
        Salvar senha
      </mat-slide-toggle>
      <a class="login-forgot" (click)="openForgotPassword()">Esqueceu sua senha?</a>
    </div>

    <button mat-raised-button color="primary" class="login-submit"
            [disabled]="load()" (click)="login()">
      @if (load()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        <span>Entrar</span>
      }
    </button>
  </div>
</div>

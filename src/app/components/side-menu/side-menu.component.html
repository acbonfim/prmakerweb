<nav class="side-nav" [class.collapsed]="isCollapsed">
  @for (item of menu; track item.link) {
    @if (isMenuItemVisible(item)) {
      <button
        type="button"
        class="nav-item"
        [class.active]="isActiveRoute(item.link)"
        (click)="navigateTo(item.link)"
        [matTooltip]="isCollapsed ? item.label : ''"
        matTooltipPosition="right"
        [attr.aria-label]="item.label"
        [attr.aria-current]="isActiveRoute(item.link) ? 'page' : null"
      >
        <span class="nav-indicator" aria-hidden="true"></span>
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        @if (!isCollapsed) {
          <span class="nav-label">{{ item.label }}</span>
        }
      </button>
    }
  }
</nav>

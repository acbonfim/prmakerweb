<div class="recent-section">
  <div class="section-header">
    <mat-icon class="header-icon">swap_horiz</mat-icon>
    <span class="section-title">Últimos handovers</span>
    <span class="header-count" *ngIf="!isLoading && items.length > 0">{{ items.length }}</span>
  </div>

  <!-- Skeleton enquanto busca -->
  <div class="recent-list" *ngIf="isLoading">
    <div class="recent-card skeleton-card" *ngFor="let s of skeletons">
      <div class="sk sk-icon"></div>
      <div class="recent-card-body">
        <div class="sk sk-title"></div>
        <div class="sk sk-line"></div>
      </div>
    </div>
  </div>

  <!-- Lista -->
  <div class="recent-list scrollable" *ngIf="!isLoading && items.length > 0">
    <div
      class="recent-card"
      *ngFor="let h of items"
      (click)="open(h)"
      role="button"
      [attr.aria-label]="'Abrir card ' + h.cardNumber"
    >
      <app-user-avatar
        class="recent-card-avatar"
        [name]="nameFor(h.userId)"
        [imageUrl]="photoFor(h.userId)"
        [size]="40"></app-user-avatar>
      <div class="recent-card-body">
        <span class="recent-card-number">AB#{{ h.cardNumber }}</span>
        <span class="recent-card-author">{{ nameFor(h.userId) || 'Autor desconhecido' }}</span>
        <span class="recent-card-date">
          <mat-icon>event</mat-icon>{{ h.createdAt | date : 'dd/MM/yyyy HH:mm' }}
        </span>
      </div>
      <mat-icon class="recent-card-arrow">chevron_right</mat-icon>
    </div>
  </div>

  <!-- Vazio -->
  <div class="empty-state" *ngIf="!isLoading && items.length === 0">
    <mat-icon>swap_horiz</mat-icon>
    <span>Nenhum handover criado ainda.</span>
  </div>
</div>

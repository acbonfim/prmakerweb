server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # IP real do cliente (0018): o Google acrescenta o IP de quem conectou ao FIM do X-Forwarded-For;
    # real_ip_recursive off usa o último item, que o cliente não consegue forjar pelo header.
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Robôs (0018): acessos automatizados vindos de servidores da AWS em Oregon (us-west-2), que
    # só carregam a tela de login. Usuários não navegam a partir de servidores EC2.
    include /etc/nginx/aws-us-west-2-ec2.conf;

    # App privado (login): nada deve ser indexado.
    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # PWA (0019): o service worker e o manifesto de versão sempre revalidados — com o cache de 1 ano
    # dos .js abaixo, o navegador nunca veria a versão nova (e o aviso "Atualizar" não apareceria).
    # Locations "=" têm prioridade sobre as regex.
    location = /ngsw.json          { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri =404; }
    location = /ngsw-worker.js     { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri =404; }
    location = /safety-worker.js   { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri =404; }
    location = /worker-basic.min.js { add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri =404; }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Ícones do app instalado: sem hash no nome → cache de 1 dia (^~ não passa pelas regex).
    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Assets com hash: cache agressivo.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # index.html nunca em cache (garante que novos deploys apareçam).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Fallback SPA: qualquer rota cai no index.html (Angular router).
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
